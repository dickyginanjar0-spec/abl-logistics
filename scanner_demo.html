<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ABL Scan Paket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Tampilan disamakan dengan web app ABL Monitoring Center (oranye-navy) */
:root{
  --navy:#0f1d33;--navy2:#172a47;--navy3:#22385c;
  --pri:#ea580c;--pri-d:#c2410c;--pri2:#fff1e8;
  --bg:#eef2f7;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f1f5f9;
  --ok:#16a34a;--okb:#dcfce7;--warn:#d97706;--warnb:#fef3c7;--bad:#dc2626;--badb:#fee2e2;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 6px 20px rgba(15,29,51,.08),0 1px 2px rgba(15,29,51,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-tap-highlight-color:transparent;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}

/* Header */
.top{background:linear-gradient(160deg,var(--navy3) 0%,var(--navy2) 38%,var(--navy) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 44px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-90px;top:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(234,88,12,.22),transparent);pointer-events:none}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand small{display:block;color:#9fb0c9;font-size:12px}
.back{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.status{max-width:560px;margin:12px auto 0;display:flex;justify-content:space-between;align-items:center;color:#cbd6e6;font-size:12px;position:relative;z-index:1}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:#f59e0b}
.dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e}

/* Sheet & card */
.wrap{max-width:560px;margin:-26px auto 0;padding:0 14px;position:relative;z-index:2}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-size:12px;font-weight:600;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:460px){.grid.two{grid-template-columns:1fr 1fr}}
label span{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
input,select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
.up{text-transform:uppercase}

/* Tahap */
.ms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ms button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.ms button i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--mut);display:grid;place-items:center;font-size:11px;font-weight:800}
.ms button.on{border-color:var(--pri);background:var(--pri2);color:var(--pri-d)}
.ms button.on i{background:var(--pri);color:#fff}

/* Tombol */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;background:var(--pri);color:#fff}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.full{width:100%}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}

/* Kamera */
.vf{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:1/1;margin-bottom:12px}
#qr-reader{width:100%}
.vf .c{position:absolute;width:28px;height:28px;border:0 solid var(--pri);transition:border-color .2s}
.vf .tl{top:14%;left:14%;border-width:3px 0 0 3px}.vf .tr{top:14%;right:14%;border-width:3px 3px 0 0}
.vf .bl{bottom:14%;left:14%;border-width:0 0 3px 3px}.vf .br{bottom:14%;right:14%;border-width:0 3px 3px 0}
.vf.ok .c{border-color:#22c55e}.vf.err .c{border-color:#ef4444}
.vf .hint{position:absolute;inset:0;display:grid;place-items:center;color:#94a3b8;font-size:13px;text-align:center;padding:20px;pointer-events:none}
.manual{display:flex;gap:8px;margin-top:12px}
.manual input{font-weight:800;letter-spacing:.5px}

/* Hasil */
.res{border-radius:14px;padding:12px 14px;font-size:13px}
.res.ok{background:var(--okb);color:#14532d}.res.bad{background:var(--badb);color:#7f1d1d}.res.warn{background:var(--warnb);color:#78350f}
.res b.code{display:block;font-size:16px;letter-spacing:.3px;margin-bottom:2px}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--soft);font-size:13px}
.hist div:last-child{border:0}
.hist small{color:var(--mut)}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-weight:700;font-size:13px;z-index:99;box-shadow:var(--shadow);max-width:92vw}
.toast.ok{background:var(--ok);color:#fff}.toast.err{background:var(--bad);color:#fff}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand"><div class="logo">ABL</div><div><b>Scan Paket</b><small>ABL Monitoring Center</small></div></div>
    <button class="back" onclick="kembali()">← Monitoring</button>
  </div>
  <div class="status">
    <span><span class="dot" id="connDot"></span><span id="connText">Menghubungkan…</span></span>
    <span id="clock">--:--:--</span>
  </div>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <section class="card" id="loginCard" hidden>
    <h3>Login Operator <small>akun scanner</small></h3>
    <div class="grid">
      <label><span>Email</span><input type="email" id="loginEmail" placeholder="nama@abl.com" autocomplete="username"></label>
      <label><span>Password</span><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"></label>
      <button class="btn full" onclick="loginOperator()">Login</button>
    </div>
  </section>

  <div id="app" hidden>
    <!-- TAHAP -->
    <section class="card">
      <h3>Tahap scan <small id="msInfo"></small></h3>
      <div class="ms" id="msGrid"></div>
    </section>

    <!-- DATA -->
    <section class="card">
      <h3>Data scan <small>tersimpan di HP ini</small></h3>
      <div class="grid two">
        <label><span>Operator ID *</span><input id="operatorId" class="up" placeholder="OP-001" autocomplete="off"></label>
        <label><span>Nama driver</span><input id="driverName" class="up" placeholder="IWAN" autocomplete="off"></label>
        <label><span>Nopol</span><input id="nopol" class="up" list="dlArmada" placeholder="L 8374 AE" autocomplete="off"></label>
        <label id="slotWrap"><span>Slot (khusus pickup)</span>
          <select id="slotTime"><option value="">— pilih slot —</option><option value="1">Slot 1</option><option value="2">Slot 2</option><option value="3">Slot 3</option></select></label>
        <label id="kapalWrap" hidden><span>Nama kapal (khusus sailing)</span><input id="namaKapal" class="up" list="dlKapal" placeholder="KM SERBA GUNA" autocomplete="off"></label>
      </div>
      <datalist id="dlArmada"></datalist><datalist id="dlKapal"></datalist>
    </section>

    <!-- KAMERA -->
    <section class="card">
      <h3>Scan barcode TO <small id="stepLabel" style="color:var(--pri-d);font-weight:800"></small></h3>
      <div class="vf" id="vf">
        <div id="qr-reader"></div>
        <div class="hint" id="vfHint">Ketuk "Aktifkan Kamera" untuk mulai scan</div>
        <div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
      </div>
      <div class="btns">
        <button class="btn" id="camBtn" onclick="toggleCamera()">Aktifkan Kamera</button>
        <button class="btn sec" onclick="flipCamera()">Ganti Kamera</button>
      </div>
      <div class="manual">
        <input type="text" id="manualBarcode" class="up" placeholder="Atau ketik barcode…" autocomplete="off" enterkeyhint="send">
        <button class="btn" onclick="submitManual()">Kirim</button>
      </div>
    </section>

    <!-- HASIL -->
    <section class="card" id="resCard" hidden>
      <h3>Hasil scan terakhir</h3>
      <div id="res"></div>
    </section>

    <section class="card">
      <h3>Riwayat sesi ini <small id="histCount">0 scan</small></h3>
      <div class="hist" id="hist"><div class="empty">Belum ada scan</div></div>
    </section>
  </div>
</div>

<script>
// ============================================================
// KONFIGURASI
// ============================================================
const SUPABASE_URL = 'https://joyxxauwqxjmzodnmerb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpveXh4YXV3cXhqbXpvZG5tZXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDQzMTcsImV4cCI6MjEwMzQyMDMxN30.9bGCy8QXl-8lG5Pn3ff2m8VoOlfvG77_8ioXSOFyF90';

// Tahap = sama dengan web app ABL Monitoring Center.
// code = milestone di tabel milestone_ref (urutan tidak boleh mundur, boleh lompat).
const STEPS = [
  { key: 'PICKUP',         label: 'Pickup',   info: 'Barang diambil dari Shopee' },
  { key: 'SCAN_OUT_TRUCK', label: 'Trucking', info: 'Naik truk ke Jambi' },
  { key: 'TRANSIT_IN',     label: 'Transit',  info: 'Tiba transit Tungkal' },
  { key: 'SAILING_OUT',    label: 'Sailing',  info: 'Naik kapal / berangkat' },
  { key: 'DOORING_IN',     label: 'Sandar',   info: 'Turun dari kapal' },
  { key: 'SCAN_IN_BATAM',  label: 'Tiba DC',  info: 'Diterima di DC tujuan (SLA selesai)' }
];
// Urutan milestone_ref (untuk hitung progres paket per LT)
const ORDER = { PICKUP: 1, SCAN_IN_GUDANG: 2, SCAN_OUT_TRUCK: 3, TRANSIT_IN: 4, TRANSIT_OUT: 5, SAILING_OUT: 6, DOORING_IN: 7, DOORING_OUT: 8, SCAN_IN_BATAM: 9 };

let step = 0, sb = null, qr = null, cams = [], camId = null, camOn = false, pos = null, hist = [];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('id-ID');

// Simpan isian di HP (kalau browser mengizinkan)
const LS = { get(k) { try { return localStorage.getItem('ablscan_' + k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem('ablscan_' + k, v); } catch (e) {} } };
['operatorId', 'driverName', 'nopol', 'slotTime', 'namaKapal'].forEach(id => {
  $(id).value = LS.get(id);
  $(id).addEventListener('change', () => LS.set(id, $(id).value.trim().toUpperCase()));
});
step = Math.min(Math.max(Number(LS.get('step')) || 0, 0), STEPS.length - 1);

setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('id-ID'); }, 1000);

function kembali() { if (window.opener) window.close(); else history.back(); }

// ============================================================
// TAHAP
// ============================================================
function renderSteps() {
  $('msGrid').innerHTML = STEPS.map((s, i) => `<button class="${i === step ? 'on' : ''}" onclick="setStep(${i})"><i>${i + 1}</i>${s.label}</button>`).join('');
  $('msInfo').textContent = STEPS[step].info;
  $('stepLabel').textContent = STEPS[step].label.toUpperCase();
  $('slotWrap').hidden = STEPS[step].key !== 'PICKUP';
  $('kapalWrap').hidden = STEPS[step].key !== 'SAILING_OUT';
}
function setStep(i) { step = i; LS.set('step', i); renderSteps(); }

// ============================================================
// SUPABASE
// ============================================================
async function init() {
  renderSteps();
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    $('connDot').className = 'dot on';
    const { data } = await sb.auth.getSession();
    if (data && data.session) masuk(data.session.user.email); else { $('connText').textContent = 'Terhubung · belum login'; $('loginCard').hidden = false; }
  } catch (e) { $('connText').textContent = 'Gagal terhubung'; toast('Gagal konek: ' + e.message, 'err'); }
}
async function loginOperator() {
  const email = $('loginEmail').value.trim(), password = $('loginPassword').value;
  if (!email || !password) return toast('Isi email dan password', 'err');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) return toast('Login gagal: ' + error.message, 'err');
  masuk(email);
}
function masuk(email) {
  $('loginCard').hidden = true; $('app').hidden = false;
  $('connText').textContent = 'Login: ' + email;
  loadLists();
  if (navigator.geolocation) { try { navigator.geolocation.watchPosition(p => { pos = p.coords; }, () => {}, { maximumAge: 60000, timeout: 10000 }); } catch (e) {} }
}
// Daftar nopol (tabel armada) & nama kapal terakhir untuk pilihan cepat
async function loadLists() {
  try {
    const { data } = await sb.from('armada').select('nopol,jenis_armada').eq('is_active', true).order('nopol');
    $('dlArmada').innerHTML = (data || []).map(a => `<option value="${esc(a.nopol)}">${esc(a.jenis_armada || '')}</option>`).join('');
  } catch (e) {}
  try {
    const { data } = await sb.from('scan_events').select('kapal').not('kapal', 'is', null).order('scanned_at', { ascending: false }).limit(200);
    const k = [...new Set((data || []).map(x => String(x.kapal).trim().toUpperCase()).filter(Boolean))];
    $('dlKapal').innerHTML = k.map(x => `<option value="${esc(x)}">`).join('');
  } catch (e) {}
}

// ============================================================
// KAMERA
// ============================================================
function toggleCamera() {
  if (camOn) return stopCamera();
  Html5Qrcode.getCameras().then(d => {
    if (!d || !d.length) return toast('Kamera tidak ditemukan', 'err');
    cams = d; camId = camId || d[d.length - 1].id; startCamera();
  }).catch(() => toast('Izin kamera ditolak — pakai ketik manual', 'err'));
}
function startCamera() {
  qr = new Html5Qrcode('qr-reader');
  qr.start(camId, { fps: 10, qrbox: { width: 230, height: 230 } }, onDecode, () => {})
    .then(() => { camOn = true; $('vfHint').hidden = true; $('camBtn').textContent = 'Matikan Kamera'; })
    .catch(err => toast('Gagal buka kamera: ' + err, 'err'));
}
function stopCamera() {
  if (!qr) return;
  qr.stop().then(() => { qr.clear(); camOn = false; $('vfHint').hidden = false; $('camBtn').textContent = 'Aktifkan Kamera'; });
}
function flipCamera() {
  if (cams.length < 2) return toast('Hanya 1 kamera tersedia', 'err');
  const i = cams.findIndex(c => c.id === camId); camId = cams[(i + 1) % cams.length].id;
  if (camOn) { stopCamera(); setTimeout(startCamera, 400); }
}
let lastCode = null, lastAt = 0;
function onDecode(t) {
  const now = Date.now();
  if (t === lastCode && now - lastAt < 3000) return;
  lastCode = t; lastAt = now;
  kirim(t.trim().toUpperCase());
}
function submitManual() {
  const v = $('manualBarcode').value.trim().toUpperCase(); if (!v) return;
  $('manualBarcode').value = ''; kirim(v);
}
$('manualBarcode').addEventListener('keydown', e => { if (e.key === 'Enter') submitManual(); });

// ============================================================
// KIRIM SCAN
// ============================================================
let busy = false;
async function kirim(barcode) {
  if (busy) return; busy = true;
  try {
    const s = STEPS[step];
    const operatorId = $('operatorId').value.trim().toUpperCase();
    if (!operatorId) { gagal(barcode, 'Isi Operator ID dulu'); $('operatorId').focus(); return; }
    const { data: ses } = await sb.auth.getSession();
    if (!ses || !ses.session) { gagal(barcode, 'Sesi login habis, login ulang'); $('app').hidden = true; $('loginCard').hidden = false; return; }

    const payload = {
      barcode: barcode, milestone: s.key, milestone_order: ORDER[s.key], operator_id: operatorId,
      driver: $('driverName').value.trim().toUpperCase() || null,
      nopol: $('nopol').value.trim().toUpperCase() || null,
      scanned_at: new Date().toISOString(),
      device_info: navigator.userAgent.substring(0, 80)
    };
    if (s.key === 'PICKUP') payload.slot_time = $('slotTime').value || null;
    if (s.key === 'SAILING_OUT') {
      payload.kapal = $('namaKapal').value.trim().toUpperCase() || null;
      if (!payload.kapal) { gagal(barcode, 'Isi nama kapal dulu untuk tahap Sailing'); $('namaKapal').focus(); return; }
    }
    if (pos) { payload.lat = pos.latitude; payload.lng = pos.longitude; }

    const { error } = await sb.from('scan_events').insert(payload);
    if (error) {
      const sudah = /sudah di milestone/i.test(error.message);
      return gagal(barcode, sudah ? 'Sudah pernah discan di tahap ini atau tahap sesudahnya' : error.message, sudah ? 'warn' : 'bad');
    }
    beep(true); flash('ok');
    const info = await ltInfo(barcode, s.key);
    tampil('ok', barcode, info, s.label);
    hist.unshift({ code: barcode, lt: info && info.no_lt, step: s.label, t: new Date() }); renderHist();
  } catch (e) { gagal(barcode, e.message || String(e)); }
  finally { busy = false; }
}
// Info LT + progres paket di tahap ini (dari master_paket.status_current yang diisi trigger)
async function ltInfo(barcode, key) {
  try {
    const { data: p } = await sb.from('master_paket').select('lt_id').eq('barcode', barcode).maybeSingle();
    if (!p || !p.lt_id) return null;
    const [lt, all] = await Promise.all([
      sb.from('master_lt').select('no_lt,tujuan,expected_paket').eq('id', p.lt_id).maybeSingle(),
      sb.from('master_paket').select('status_current,jumlah_paket').eq('lt_id', p.lt_id)
    ]);
    const rows = all.data || [], o = ORDER[key];
    const done = rows.filter(r => (ORDER[r.status_current] || 0) >= o);
    // 1 barcode = 1 TO. Jumlah paket per TO tidak ada di master Supabase, jadi progres dihitung per TO.
    return Object.assign({}, lt.data || {}, { toDone: done.length, toAll: rows.length });
  } catch (e) { return null; }
}
function tampil(cls, code, info, label) {
  $('resCard').hidden = false;
  let h = `<b class="code">${esc(code)}</b>`;
  if (cls === 'ok') {
    h += `✓ Tersimpan · ${esc(label)}`;
    if (info && info.no_lt) {
      const pct = info.toAll ? Math.round(info.toDone / info.toAll * 100) : 0;
      h += `<div style="margin-top:6px"><b>${esc(info.no_lt)}</b> · ${esc(info.tujuan || '-')}</div>
        <div><b>${nf.format(info.toDone)}/${nf.format(info.toAll)} TO</b> sudah ${esc(label.toLowerCase())}${info.toAll - info.toDone > 0 ? ` · kurang ${nf.format(info.toAll - info.toDone)} TO` : ' · lengkap ✓'}</div>
        <div class="bar"><i style="width:${pct}%"></i></div>`;
    } else h += `<div style="margin-top:6px">⚠ Barcode belum terdaftar di master paket — cek ke admin.</div>`;
  } else h += esc(info);
  $('res').className = 'res ' + cls; $('res').innerHTML = h;
}
function gagal(code, msg, cls) { beep(false); flash('err'); tampil(cls || 'bad', code, msg); toast(msg, 'err'); }
function renderHist() {
  $('histCount').textContent = hist.length + ' scan';
  $('hist').innerHTML = hist.slice(0, 30).map(h => `<div><span><b>${esc(h.code)}</b> <small>${esc(h.lt || '')}</small><br><small>${esc(h.step)}</small></span><small>${h.t.toLocaleTimeString('id-ID')}</small></div>`).join('');
}

// ============================================================
// UTIL
// ============================================================
function flash(t) { const v = $('vf'); v.classList.add(t); setTimeout(() => v.classList.remove('ok', 'err'), 600); }
function beep(ok) {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    (ok ? [0] : [0, .18]).forEach(d => {
      const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination);
      if (!ok) o.type = 'square';
      o.frequency.setValueAtTime(ok ? 900 : 240, c.currentTime + d);
      if (ok) o.frequency.exponentialRampToValueAtTime(1300, c.currentTime + .12);
      g.gain.setValueAtTime(.3, c.currentTime + d); g.gain.exponentialRampToValueAtTime(.01, c.currentTime + d + (ok ? .2 : .15));
      o.start(c.currentTime + d); o.stop(c.currentTime + d + (ok ? .2 : .15));
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 60 : [80, 60, 80]); } catch (e) {}
}
function toast(msg, type) {
  const t = document.createElement('div'); t.className = 'toast ' + (type || 'ok'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}

window.addEventListener('DOMContentLoaded', init);
</script>
