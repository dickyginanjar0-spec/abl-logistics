<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABL Control Tower — Dashboard Rekon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --asphalt:#14171a; --panel:#1e2328; --panel-raised:#262c33;
    --steel:#3a424c; --hazard:#ff6b35; --go:#00c896; --go-dim:#00755a;
    --warn:#ffc84a; --danger:#ff4d4d; --text:#eef1f4; --text-mute:#8a939e; --line:#2f363e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--asphalt);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .stripe-bar{height:6px;background:repeating-linear-gradient(135deg,var(--hazard) 0 14px,var(--asphalt) 14px 28px);}
  header{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--hazard);text-transform:uppercase;margin-bottom:6px;}
  h1{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
  .sub{color:var(--text-mute);font-size:12px;margin-top:4px;}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px;}

  .status-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--panel-raised);border-radius:8px;margin-bottom:16px;font-size:11px;color:var(--text-mute);flex-wrap:wrap;gap:8px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .dot.on{background:var(--go);box-shadow:0 0 6px var(--go);animation:pulse 2s infinite;}
  .dot.off{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  .config-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
  .config-panel h2{font-family:'Oswald',sans-serif;font-size:14px;text-transform:uppercase;color:var(--text-mute);margin-bottom:12px;}
  .config-row{display:flex;gap:8px;flex-wrap:wrap;}
  .config-row input{flex:1;min-width:200px;padding:11px 12px;background:var(--panel-raised);border:1px solid var(--steel);border-radius:6px;color:var(--text);font-size:13px;}
  .btn{padding:11px 18px;border:none;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-hazard{background:var(--hazard);color:#14171a;}
  .btn-steel{background:var(--panel-raised);color:var(--text);border:1px solid var(--steel);}

  .kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;}
  @media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:520px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--steel);}
  .kpi.c-go::before{background:var(--go);} .kpi.c-warn::before{background:var(--warn);}
  .kpi.c-danger::before{background:var(--danger);} .kpi.c-hazard::before{background:var(--hazard);}
  .kpi-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-mute);text-transform:uppercase;margin-bottom:6px;}
  .kpi-val{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:7px 14px;background:var(--panel-raised);border:1px solid var(--steel);border-radius:20px;font-size:11px;font-weight:600;color:var(--text-mute);cursor:pointer;}
  .chip.active{background:var(--hazard);color:#14171a;border-color:var(--hazard);}

  .lt-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px;}
  .lt-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .lt-no{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--hazard);}
  .lt-meta{font-size:11px;color:var(--text-mute);margin-top:3px;}
  .badge{padding:4px 10px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
  .badge.match, .badge.completed{background:rgba(0,200,150,0.15);color:var(--go);}
  .badge.progress{background:rgba(255,107,53,0.15);color:var(--hazard);}
  .badge.outstanding{background:rgba(255,77,77,0.15);color:var(--danger);}
  .badge.belum{background:var(--panel-raised);color:var(--text-mute);}
  .badge.sla-ok{background:rgba(0,200,150,0.15);color:var(--go);}
  .badge.sla-warn{background:rgba(255,200,74,0.15);color:var(--warn);}
  .badge.sla-over{background:rgba(255,77,77,0.15);color:var(--danger);}

  .rail-mini{display:flex;gap:4px;margin-top:12px;}
  .rail-mini .seg{flex:1;height:5px;border-radius:3px;background:var(--line);position:relative;}
  .rail-mini .seg.done{background:var(--go);}
  .rail-mini .seg.now{background:var(--hazard);}
  .rail-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-mute);margin-top:4px;font-family:'JetBrains Mono',monospace;}

  .progress-track{height:6px;background:var(--panel-raised);border-radius:3px;overflow:hidden;margin-top:10px;}
  .progress-fill{height:100%;background:var(--go);border-radius:3px;transition:width .3s;}
  .progress-fill.warn{background:var(--warn);}
  .progress-fill.over{background:var(--danger);}

  .empty{text-align:center;padding:50px 20px;color:var(--text-mute);}
  .empty .ic{font-size:36px;margin-bottom:10px;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:8px;font-weight:700;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  .toast.ok{background:var(--go);color:#0a0f0d;}
</style>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6b35">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>

<div class="stripe-bar"></div>
<header>
  <div>
    <div class="eyebrow">// CONTROL TOWER</div>
    <h1>Dashboard Rekonsiliasi</h1>
    <div class="sub">Data langsung dari database — update otomatis tiap ada scan baru</div>
  </div>
</header>

<div class="wrap">

  <div class="status-bar">
    <span><span class="dot off" id="connDot"></span><span id="connText">Belum terhubung ke database</span></span>
    <span id="lastSync">Belum pernah sync</span>
  </div>

  <div class="config-panel" id="configPanel">
    <h2>⚙ Koneksi Supabase</h2>
    <div class="config-row">
      <input type="text" id="sbUrl" placeholder="Project URL — https://xxxx.supabase.co">
      <input type="text" id="sbKey" placeholder="Anon Public Key">
      <button class="btn btn-hazard" onclick="connectSupabase()">🔌 Hubungkan</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi c-hazard"><div class="kpi-label">Total LT</div><div class="kpi-val" id="kTotal">-</div></div>
    <div class="kpi c-go"><div class="kpi-label">Completed</div><div class="kpi-val" id="kCompleted">-</div></div>
    <div class="kpi"><div class="kpi-label">On Progress</div><div class="kpi-val" id="kProgress">-</div></div>
    <div class="kpi c-danger"><div class="kpi-label">Outstanding</div><div class="kpi-val" id="kOutstanding">-</div></div>
    <div class="kpi"><div class="kpi-label">Total Paket</div><div class="kpi-val" id="kPaket">-</div></div>
    <div class="kpi c-warn"><div class="kpi-label">On-Time %</div><div class="kpi-val" id="kOntime">-</div></div>
  </div>

  <div class="toolbar">
    <div class="filter-chips" id="filterChips">
      <div class="chip active" data-f="ALL">Semua</div>
      <div class="chip" data-f="ON PROGRESS">On Progress</div>
      <div class="chip" data-f="OUTSTANDING">Outstanding</div>
      <div class="chip" data-f="COMPLETED">Completed</div>
    </div>
    <button class="btn btn-steel" onclick="fetchDashboard()">🔄 Refresh Manual</button>
  </div>

  <div id="ltList"></div>

</div>

<script>
let sbClient = null;
let allRows = [];
let currentFilter = 'ALL';
const MILESTONES = ['t_pickup','t_trucking','t_transit','t_sailing','t_dooring'];
const MS_LABELS = ['PICKUP','TRUCK','TRANSIT','SAIL','DOOR'];

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.f;
    renderList();
  });
});

function connectSupabase(){
  const url = document.getElementById('sbUrl').value.trim();
  const key = document.getElementById('sbKey').value.trim();
  if(!url || !key){ showToast('Isi URL dan Key dulu'); return; }
  sbClient = window.supabase.createClient(url, key);
  document.getElementById('connDot').className = 'dot on';
  document.getElementById('connText').textContent = 'Terhubung — realtime aktif';
  document.getElementById('configPanel').style.display = 'none';
  fetchDashboard();
  subscribeRealtime();
}

async function fetchDashboard(){
  if(!sbClient){ showToast('Hubungkan database dulu'); return; }
  const { data, error } = await sbClient.from('v_dashboard_rekon').select('*');
  if(error){ showToast('Error: '+error.message); return; }
  allRows = data || [];
  document.getElementById('lastSync').textContent = 'Sync: '+new Date().toLocaleTimeString('id-ID');
  renderKPI();
  renderList();
}

function subscribeRealtime(){
  sbClient.channel('rekon_live')
    .on('postgres_changes', {event:'*', schema:'public', table:'scan_events'}, ()=>{
      fetchDashboard();
      showToast('✓ Data baru masuk — dashboard diperbarui');
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'master_lt'}, ()=>{
      fetchDashboard();
    })
    .subscribe();
}

function renderKPI(){
  const total = allRows.length;
  const completed = allRows.filter(r=>r.status_rekon==='COMPLETED').length;
  const progress = allRows.filter(r=>r.status_rekon==='ON PROGRESS').length;
  const outstanding = allRows.filter(r=>r.status_rekon==='OUTSTANDING').length;
  const paket = allRows.reduce((s,r)=>s+(r.paket_terscan||0),0);
  const ontimeCount = allRows.filter(r=> r.durasi_jam_berjalan <= r.sla_target_jam).length;
  const ontimePct = total>0 ? ((ontimeCount/total)*100).toFixed(0) : 0;

  document.getElementById('kTotal').textContent = total;
  document.getElementById('kCompleted').textContent = completed;
  document.getElementById('kProgress').textContent = progress;
  document.getElementById('kOutstanding').textContent = outstanding;
  document.getElementById('kPaket').textContent = paket.toLocaleString('id-ID');
  document.getElementById('kOntime').textContent = ontimePct+'%';
}

function renderList(){
  const list = document.getElementById('ltList');
  let rows = allRows;
  if(currentFilter !== 'ALL') rows = rows.filter(r=>r.status_rekon===currentFilter);

  if(rows.length===0){
    list.innerHTML = `<div class="empty"><div class="ic">📭</div><p>Tidak ada data untuk filter ini</p></div>`;
    return;
  }

  list.innerHTML = rows.map(r=>{
    const statusClass = {
      'COMPLETED':'completed','MATCH':'match','ON PROGRESS':'progress',
      'OUTSTANDING':'outstanding','BELUM MULAI':'belum'
    }[r.status_rekon] || 'belum';

    const slaRatio = r.sla_target_jam ? (r.durasi_jam_berjalan / r.sla_target_jam) : 0;
    let slaClass = 'sla-ok', slaLabel = 'ON TIME';
    if(slaRatio > 1.2){ slaClass='sla-over'; slaLabel='OVER SLA'; }
    else if(slaRatio > 1){ slaClass='sla-warn'; slaLabel='WARNING'; }

    const doneCount = MILESTONES.filter(m=>r[m]).length;
    const railHtml = MILESTONES.map((m,i)=>{
      let cls = 'seg';
      if(r[m]) cls += ' done';
      else if(i===doneCount) cls += ' now';
      return `<div class="${cls}"></div>`;
    }).join('');

    const progressPct = Math.min(slaRatio*100, 100);
    const progFillClass = slaRatio>1.2 ? 'over' : (slaRatio>1 ? 'warn' : '');

    return `
    <div class="lt-card">
      <div class="lt-top">
        <div>
          <div class="lt-no">${r.no_lt}</div>
          <div class="lt-meta">Tujuan: ${r.tujuan||'-'} · Paket: ${r.paket_terscan}/${r.expected_paket} · ${(r.kg_terscan||0).toLocaleString('id-ID')} Kg</div>
        </div>
        <div style="display:flex;gap:6px;">
          <span class="badge ${statusClass}">${r.status_rekon}</span>
          <span class="badge ${slaClass}">${slaLabel}</span>
        </div>
      </div>
      <div class="rail-mini">${railHtml}</div>
      <div class="rail-labels">${MS_LABELS.map(l=>`<span>${l}</span>`).join('')}</div>
      <div class="progress-track"><div class="progress-fill ${progFillClass}" style="width:${progressPct}%"></div></div>
      <div class="lt-meta" style="margin-top:6px;">Durasi berjalan: ${(r.durasi_jam_berjalan||0).toFixed(1)} jam / target ${r.sla_target_jam} jam</div>
    </div>`;
  }).join('');
}

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast ok';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
</script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('ABL PWA registered', reg.scope);
    }).catch(err => console.log('PWA fail', err));
  });
}
</script>

</body>
</html>
